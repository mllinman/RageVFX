<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2a2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7931e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bgGradient)" stroke="#444" stroke-width="2"/>
  
  <!-- VFX Node Pattern - represents the node-based workflow -->
  <!-- Central Node -->
  <rect x="88" y="88" width="80" height="60" rx="8" fill="#2c2c2c" stroke="url(#accentGradient)" stroke-width="3"/>
  <rect x="88" y="88" width="80" height="20" rx="8" ry="8" fill="url(#accentGradient)"/>
  
  <!-- Node Sockets -->
  <circle cx="88" cy="118" r="6" fill="#4a9eff" filter="url(#glow)"/>
  <circle cx="168" cy="118" r="6" fill="#4a9eff" filter="url(#glow)"/>
  
  <!-- Input Node Left -->
  <rect x="28" y="98" width="40" height="40" rx="6" fill="#2c2c2c" stroke="#555" stroke-width="2"/>
  <circle cx="68" cy="118" r="5" fill="#4a9eff"/>
  
  <!-- Output Node Right -->
  <rect x="188" y="98" width="40" height="40" rx="6" fill="#2c2c2c" stroke="#555" stroke-width="2"/>
  <circle cx="188" cy="118" r="5" fill="#4a9eff"/>
  
  <!-- Connection Lines -->
  <path d="M 68 118 Q 78 118 88 118" stroke="#4a9eff" stroke-width="2" fill="none"/>
  <path d="M 168 118 Q 178 118 188 118" stroke="#4a9eff" stroke-width="2" fill="none"/>
  
  <!-- VFX Effect Particles -->
  <circle cx="128" cy="170" r="4" fill="#ff6b35" opacity="0.8"/>
  <circle cx="108" cy="180" r="3" fill="#f7931e" opacity="0.6"/>
  <circle cx="148" cy="175" r="3" fill="#ff6b35" opacity="0.7"/>
  <circle cx="118" cy="190" r="2" fill="#f7931e" opacity="0.5"/>
  <circle cx="138" cy="185" r="2" fill="#ff6b35" opacity="0.6"/>
  
  <!-- Text: R -->
  <text x="128" y="115" font-family="Arial Black, Arial" font-size="28" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">R</text>
  
  <!-- Decorative rays -->
  <g stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.3">
    <line x1="128" y1="40" x2="128" y2="55"/>
    <line x1="180" y1="60" x2="168" y2="72"/>
    <line x1="76" y1="60" x2="88" y2="72"/>
    <line x1="200" y1="128" x2="185" y2="128"/>
    <line x1="56" y1="128" x2="71" y2="128"/>
  </g>
</svg>
